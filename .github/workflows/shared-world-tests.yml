name: Shared-world roleplay tests

on:
  push:
    branches:
      - feature/shared-world-roleplay-v1
      - chloe-command-ui-polish
  pull_request:
    branches:
      - main

jobs:
  shared-world-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check changed runtime files
        run: |
          node --check index.js
          node --check commands/chloe.js
          node --check commands/sharedWorld.js
          node --check commands/owner.js
          node --check commands/cshop.js
          node --check lib/chloePersona.js
          node --check lib/chloeStyle.js
          node --check lib/chloeStickers.js
          node --check lib/chloePriorityStore.js
          node --check lib/characterRegistry.js
          node --check lib/subscriptionStore.js
          node --check lib/companionMemory.js
          node --check lib/sharedWorldStore.js
          node --check lib/relationshipStore.js
          node --check lib/commandRegistry.js

      - name: Test shared-world lifecycle and isolation
        run: node test/sharedWorld.test.js

      - name: Test manual subscription commands and access control
        run: node test/subscriptionCommand.test.js

      - name: Test Chloe relationship boundaries and action formatting
        run: node test/chloeBehavior.test.js

      - name: Test Chloe persistent priority memory
        run: node test/chloePriorityStore.test.js

      - name: Test Chloe sticker relationship gating
        run: node test/chloeStickers.test.js

      - name: Test CShop public message formatting
        run: node test/cshopFormat.test.js

      - name: Test public command-help copy
        run: node test/commandHelp.test.js
