<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Z_Cut editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a focused night-time editing bay, quiet chrome, the footage is the hero
   IDEA: a cutting bench: lit monitor over stacked layers that slide under a fixed blade (the playhead)
   PICTURE: the live preview canvas and the layer stack with its switches
   COLOUR and TYPE: graphite bench, slate panels, coral blade + keyframe diamonds; Manrope
   LAYOUT: top bar, monitor, transport, layer panel + timeline, contextual tool dock */
:root{color-scheme:dark;--bg:#0f1013;--panel:#17191e;--panel2:#1f2229;--line:#2b2f38;--ink:#eceef2;--mute:#8d93a1;--blade:#ff5a3c;--vid:#3f63d8;--txt:#9b5de5;--aud:#1fa37a;--img:#c2416b;--key:#ff5a3c;--rowh:46px;--laneh:24px;--lw:100px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 14px/1.4 Manrope,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blade);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto auto auto auto;height:100dvh}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em;margin-right:4px}.logo b{color:var(--blade)}
.top input{flex:1;min-width:60px;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px Manrope,sans-serif}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--ink)}
.ib:hover{background:var(--panel2)}.ib:disabled{opacity:.35}
.export{height:34px;padding:0 12px;border-radius:9px;background:var(--blade);color:#fff;font-weight:800}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1b1e25,var(--bg) 70%)}
.monitor{position:absolute;inset:10px;display:grid;place-items:center}
#cv{display:block;background:#000;border-radius:6px;box-shadow:0 10px 40px #0009}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:20px;pointer-events:none}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.transport{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line)}
.tc{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);cursor:text}.tc b{color:var(--ink);border-bottom:1px dashed #ffffff40}.tc b:hover{color:var(--blade)}
.tc small{display:block;font-size:10px;color:#6c8cff;font-weight:700}
.tc input{width:108px;height:30px;padding:0 8px;border-radius:7px;border:1px solid var(--blade);background:var(--bg);color:var(--ink);font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace}
.play{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:22px;height:22px;fill:currentColor;stroke:none}
.right{display:flex;align-items:center;gap:2px}.right .ib{width:32px;height:32px}
.right select{min-width:62px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 12px Manrope,sans-serif;padding:0 4px}
.tl{position:relative;display:flex;height:clamp(180px,32vh,340px);background:var(--bg);border-top:1px solid var(--line)}
.layers{flex:none;width:var(--lw);overflow:hidden;border-right:1px solid var(--line);background:var(--panel)}
.layers .head{position:sticky;top:0;height:46px;padding-top:22px !important;border-bottom:1px solid var(--line);background:var(--panel);font-size:10px;color:var(--mute);padding:4px 8px;display:flex;gap:6px;align-items:center}
.layers .head .hnm{flex:1;padding-left:30px}.layers .head .hic{display:flex;gap:2px;margin-right:6px}.layers .head .hic svg.i{width:14px;height:14px;margin:0 6px;color:var(--mute)}
.lrow{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;height:var(--rowh);padding:0 6px;border-bottom:1px solid #1a1c21;font-size:11.5px}
.lrow.sel{background:#232733}
.lrow .num{width:14px;color:var(--mute);font-size:10.5px;text-align:center}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:26px;height:26px;border-radius:6px;display:none;place-items:center;color:#5a6070;font:800 10px Manrope,sans-serif}
.sw.on{color:var(--ink)}.sw.mbon,.sw.tdon{color:#ffd34d}.sw.solo.on{color:var(--blade)}
.sw.eye,.sw.audio{display:grid}.sw.audio{font-size:15px;color:#5a6070}.sw.audio.on{color:var(--aud)}
.sw svg.i{width:16px;height:16px}
.llane{height:var(--laneh);display:flex;align-items:center;gap:4px;padding:0 8px 0 22px;font-size:10.5px;color:var(--mute);border-bottom:1px solid #1a1c21;background:#14161a;white-space:nowrap;overflow:hidden}
.area{position:relative;flex:1}
.scroll{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.strip{position:relative;min-height:100%}
.ruler{position:sticky;top:0;height:46px;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);cursor:ew-resize;touch-action:none}
.tick{position:absolute;top:24px;bottom:0;border-left:1px solid var(--line);font:600 10px Manrope,sans-serif;color:var(--mute);padding:2px 0 0 4px;white-space:nowrap;pointer-events:none}
.row{position:relative;height:var(--rowh);border-bottom:1px solid #1a1c21}
.row.sel{background:#151820}
.lane{position:relative;height:var(--laneh);background:#14161a;border-bottom:1px solid #1a1c21}
.clip{position:absolute;top:4px;height:calc(var(--rowh) - 8px);border-radius:7px;overflow:hidden;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;background:var(--vid);touch-action:pan-x pan-y;box-shadow:inset 0 0 0 1px #ffffff1f;cursor:grab}
.clip.text{background:var(--txt)}.clip.audio{background:var(--aud)}.clip.image{background:var(--img)}
.clip.hidden{opacity:.35}.clip.locked{cursor:not-allowed}
.clip .thumb{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.55;pointer-events:none}
.clip .lbl{position:relative;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000a;pointer-events:none}
.clip .badge{position:relative;margin-left:6px;padding:1px 5px;border-radius:5px;background:#0006;font-size:10px;pointer-events:none}
.clip.sel{box-shadow:inset 0 0 0 2px #fff;touch-action:none}
.clip.multi{box-shadow:inset 0 0 0 2px var(--blade)}
.clip .h{position:absolute;top:0;bottom:0;width:14px;background:#fff;display:none;align-items:center;justify-content:center;cursor:ew-resize}
.clip .h::after{content:"";width:2px;height:14px;border-radius:2px;background:#333}
.clip.sel .h{display:flex}.clip .h.l{left:0}.clip .h.r{right:0}
.kf{position:absolute;top:5px;width:13px;height:13px;margin-left:-6.5px;transform:rotate(45deg);background:var(--key);border:2px solid #fff3;border-radius:2px;touch-action:pan-x pan-y;z-index:2;cursor:ew-resize}
.kf.ease{border-radius:50%;transform:none}.kf.ein{border-radius:50% 2px 2px 50%;transform:none}.kf.eout{border-radius:2px 50% 50% 2px;transform:none}.kf.hold{background:#ffd34d;border-radius:1px;transform:none}.kf.sel{border-color:#fff;box-shadow:0 0 0 2px var(--blade)}
.blade{position:absolute;top:0;bottom:0;left:0;width:14px;margin-left:-7px;z-index:5;cursor:ew-resize;touch-action:none}
.blade::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--blade);box-shadow:0 0 0 1px #0006}
.blade::before{content:"";position:absolute;top:0;left:1px;border:6px solid transparent;border-top:8px solid var(--blade)}
.blade.off{display:none}
.ptab{height:26px;padding:0 6px;border-radius:6px;font-size:11.5px;color:var(--mute);font-weight:700}.ptab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--blade);border-radius:0}
.plist[hidden]{display:none !important}
.fxsearch{width:100%;height:32px;margin:6px 0;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px Manrope,sans-serif}
.fxitem{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:12.5px;cursor:grab}.fxitem:hover{background:var(--panel2)}
.fxitem span{flex:1}.fxitem svg.i{width:16px;height:16px;color:var(--mute)}.fxitem .padd{width:26px;height:26px}
.ecname{font-size:12px;color:var(--mute);margin:6px 4px}
.ecfx{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#14161a;overflow:hidden}.ecfx.off{opacity:.55}
.echead{display:flex;align-items:center;gap:4px;padding:6px;background:var(--panel2);font-size:12px}.echead b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ecbtn{min-width:24px;height:24px;border-radius:6px;font-size:12px;color:var(--mute)}.ecbtn.on{color:var(--blade);font-weight:800}.ecbtn:hover{background:var(--panel)}
.ecrow{display:grid;grid-template-columns:22px minmax(0,1fr) 22px 62px;align-items:center;gap:2px 4px;padding:4px 6px;font-size:11.5px;color:var(--mute);border-top:1px solid #1e2127}
.ecrow input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--blade)}.ecrow output{font:700 11px ui-monospace,Menlo,monospace;color:#6cb4ff;text-align:right}
.ecrow .lw,.ecrow .eckey{width:22px;height:22px;display:grid;place-items:center;color:#5a6070}.ecrow .lw svg.i,.ecrow .eckey svg.i{width:14px;height:14px}.ecrow .lw.on{color:var(--blade)}.ecrow .eckey.has{color:var(--key)}
.ecrow input[type=color]{grid-column:3/-1;width:100%;height:24px;border:0;background:none}
.cwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
#cedit{width:100%;max-height:300px;touch-action:none;background:#0d0e11;border-radius:10px}
#cedit [data-ch]{cursor:grab}
.cside code{display:block;margin:8px 0;font:700 12px ui-monospace,Menlo,monospace;color:#6cb4ff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:6px}
.ctile{position:relative;display:grid;gap:2px;justify-items:center;padding:6px 4px;border-radius:9px;border:1px solid var(--line);background:#121418;font-size:10.5px;color:var(--mute)}
.ctile:hover{border-color:var(--blade);color:var(--ink)}.ctile svg{width:56px;height:56px}
.ctile i{position:absolute;top:2px;right:4px;font-style:normal;color:var(--mute)}
@media (max-width:759px){.cwrap{grid-template-columns:1fr}}
.scode{width:100%;min-height:190px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b0c0f;color:#d9e1ff;font:500 12.5px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
.slog{max-height:180px;overflow:auto;margin:8px 0 0;padding:8px;border-radius:8px;background:#0b0c0f;color:#9fe6b8;font:500 11.5px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.slog:empty{display:none}
.sheet .sname{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px Manrope,sans-serif}
@media (min-width:760px){.sheet.wide{width:min(680px,94vw)}}
.graph{position:absolute;left:0;right:0;top:46px;bottom:0;z-index:4;background:#121418;touch-action:none;width:100%;height:calc(100% - 46px)}
.graph[hidden],.gtools[hidden]{display:none}
.gtools{position:absolute;left:7px;right:7px;top:51px;z-index:6;display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mute);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.gtools::-webkit-scrollbar{display:none}
.gtools button{flex:none;height:27px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--mute)}
.gtools button.on{color:var(--ink);border-color:var(--blade)}
.gtools .gsep{flex:none;width:1px;height:18px;background:var(--line);margin:0 2px}
.gtools #glabel{margin-left:auto;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px}
@media(max-width:759px){.gtools{top:48px;left:4px;right:4px;gap:3px}.gtools button{height:32px;padding:0 10px}.gtools #glabel{display:none}}
@media (min-width:800px) and (max-width:1199px){
  .transport{gap:4px;padding:4px 6px}.transport .play{width:38px;height:38px}
  .trims{gap:2px;margin-right:4px}.trims .ib{width:28px;height:28px}.trims .sep{margin:6px 1px}
  .right select{min-width:52px;font-size:11px}.right .ib{width:26px}.tc{font-size:11px}
}
.tltools{position:absolute;left:0;top:0;width:var(--lw);height:22px;z-index:8;display:flex;justify-content:flex-end;align-items:center;gap:2px;padding:0 6px;pointer-events:none}
.tlb{pointer-events:auto;width:24px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--mute)}
.tlb svg.i{width:15px;height:15px}.tlb:hover{background:var(--panel2)}.tlb.on{color:var(--blade);background:#ff5a3c1f}
.tlfoot{position:absolute;left:0;bottom:0;width:var(--lw);height:26px;z-index:7;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line)}
.rtime{display:none;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden}.rtime b{color:#6c8cff}
.layers{padding-bottom:26px}.strip{padding-bottom:26px}
@media (min-width:760px){.rtime{display:block}}
.wa{position:absolute;top:8px;height:9px;background:#56627a;border-radius:3px;cursor:grab;z-index:1}
.wa .wah{position:absolute;top:-2px;width:9px;height:12px;background:#5aa0ff;border-radius:3px;cursor:ew-resize}.wa .wah.l{left:-4px}.wa .wah.r{right:-4px}
.wa.full{background:#3a4152}
.pbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#1b1e25;border-top:1px solid var(--line)}
.pbar[hidden]{display:none}
.pbar .pn{font-size:12px;color:var(--mute);white-space:nowrap;min-width:64px}
.pbar input[type=range]{flex:1;accent-color:var(--blade)}
.pbar .pv{font:700 12px ui-monospace,Menlo,monospace;color:#6cb4ff;min-width:58px;text-align:right;cursor:text}
.pbar .pv input{width:64px;height:26px;border-radius:6px;border:1px solid #6cb4ff;background:var(--bg);color:var(--ink);font:700 12px ui-monospace,Menlo,monospace;padding:0 4px}
.pbar .kb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mute);flex:none}
.pbar .kb.on{color:var(--key)}
@media (max-width:759px){.pbar{flex-wrap:wrap;row-gap:2px}.pbar .pn{flex:1}.pbar input[type=range]{order:9;flex-basis:100%;height:28px}}.pbar .kb.watch.on{color:var(--blade);background:#ff5a3c1f}
.tool.keyhere svg{color:var(--key)}.tool.lab svg,.pop button.lab svg{color:var(--lc);fill:var(--lc)}
.knav{display:none;flex:none}.knav button{width:16px;height:20px;display:grid;place-items:center;color:#5a6070}.knav button svg.i{width:12px;height:12px}.knav button.has{color:var(--key)}
@media (min-width:760px){.knav{display:flex}}
.cset{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 10px;align-items:center;margin:8px 0}
.cset label{font-size:12px;color:var(--mute)}
.cset input,.cset select{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px Manrope,sans-serif;padding:0 8px;width:100%}
.cset input[type=color]{padding:2px;width:60px}
.cset .two{display:flex;gap:6px;align-items:center}
.llane .lw{display:none;width:20px;height:20px;place-items:center;color:#5a6070;flex:none}.llane .lw.on{color:var(--blade)}.llane .lw svg.i{width:14px;height:14px}
.llane .ln{flex:1;overflow:hidden;text-overflow:ellipsis}
.llane .hot{display:none;color:#6cb4ff;cursor:ew-resize;font:700 11px ui-monospace,Menlo,monospace;padding:2px 4px;border-radius:4px;touch-action:none}.llane .hot:hover{background:#6cb4ff22}
.llane input{width:70px;height:20px;border-radius:4px;border:1px solid #6cb4ff;background:var(--bg);color:var(--ink);font:700 11px ui-monospace,Menlo,monospace;padding:0 4px}
.proj{display:none}
.pitem{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:grab}
.pitem:hover{background:var(--panel2)}
.pthumb{width:48px;height:30px;border-radius:5px;background:#000 center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.pthumb svg.i{width:16px;height:16px}
.pname{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pmeta{font-size:10.5px;color:var(--mute)}
.padd{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink);background:var(--panel2)}
.psec{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:10px 6px 4px}
.pempty{color:var(--mute);font-size:12px;padding:10px 6px}
.area.dropping{box-shadow:inset 0 0 0 2px var(--blade)}
@media (min-width:760px){
  .llane .lw{display:grid}.llane .hot{display:block}
}
.side{display:contents}
/* PC: After Effects style arrangement — Project left, viewer centre, Properties right, timeline across the bottom */
@media (min-width:800px){
  #app{grid-template-columns:clamp(190px,18vw,250px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto minmax(200px,38vh) auto;
    grid-template-areas:"top top" "proj stage" "proj trans" "tabs tabs" "tl tl" "side side"}
  #app.noproj{grid-template-columns:0 minmax(0,1fr)}
  .top{grid-area:top}.stage{grid-area:stage}.transport{grid-area:trans}.tabs{grid-area:tabs}#app>.tl,#app>.queue{grid-area:tl;height:auto;min-height:0}
  .proj{grid-area:proj;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
  #app.noproj .proj{display:none}
  .proj header{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
  .proj header span{flex:1}.proj header .ib{width:30px;height:30px}
  .proj .plist{flex:1;overflow:auto;padding:4px 6px}
  .proj.drop{box-shadow:inset 0 0 0 2px var(--blade)}
  .side{grid-area:side;display:block}
  .stage .monitor{left:10px}
}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 6px 0;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px 8px 0 0;font-size:12px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-bottom:0}
.tab.on{color:var(--ink);background:#14161a;box-shadow:inset 0 2px 0 var(--blade)}
.tab .x{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;color:var(--mute)}.tab .x:hover{background:var(--panel2);color:var(--ink)}
.queue{height:clamp(180px,32vh,340px);overflow:auto;padding:12px;background:#14161a;border-top:1px solid var(--line)}
.queue[hidden],.tl[hidden]{display:none}
.qitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.qitem b{font-size:13px}.qitem small{color:var(--mute);font-size:11.5px}
.qbar{grid-column:1/-1;height:4px;border-radius:3px;background:var(--line);overflow:hidden}.qbar i{display:block;height:100%;background:#3ddc84;width:0}
.btn{height:34px;padding:0 14px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.btn.main{background:var(--blade);border-color:var(--blade);color:#fff;font-weight:800}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.qhead h3{margin:0 auto 0 0;font-size:14px}
.clip.comp{background:#c27c0e}
.tw{width:20px;height:22px;display:grid;place-items:center;color:var(--mute);flex:none}
.tw svg.i{width:14px;height:14px;transition:transform .15s}.tw.open svg.i{transform:rotate(90deg)}
.tw.nokeys{opacity:.45}
.scroll.selmode,.scroll.selmode .clip{touch-action:pan-x pan-y}
.selbar{display:none;position:absolute;right:8px;bottom:8px;z-index:6;padding:4px 10px;border-radius:999px;background:var(--blade);color:#fff;font-size:11px;font-weight:800;pointer-events:none}
.selmode~.selbar{display:block}
.clip .cbar{position:absolute;left:0;bottom:0;height:3px;background:#3ddc84;pointer-events:none;transition:width .2s}
.marq{position:absolute;display:none;z-index:6;border:1px solid var(--blade);background:#ff5a3c22;pointer-events:none}
.tip{position:fixed;z-index:40;padding:5px 9px;border-radius:7px;background:#000;color:#fff;font-size:11.5px;border:1px solid var(--line);pointer-events:none;opacity:0;white-space:nowrap}.tip.on{opacity:1}
.dock .sep,.trims .sep{flex:none;width:1px;background:var(--line);margin:8px 4px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.trims{display:none;align-items:center;gap:4px;margin-right:10px}.trims .ib{width:34px;height:34px;border:1px solid var(--line)}
@media (min-width:600px){.trims{display:flex}}
.dock{display:flex;align-items:stretch;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);scrollbar-width:thin;min-height:66px}
.dock .ctx{flex:none;display:flex;align-items:center;padding:0 8px;font-size:11px;color:var(--mute);border-right:1px solid var(--line);margin-right:4px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool{flex:none;display:grid;justify-items:center;align-content:center;gap:3px;min-width:58px;padding:6px 4px;border-radius:10px;font-size:10.5px;color:var(--mute)}
.tool svg{color:var(--ink)}.tool:hover{background:var(--panel2)}.tool.on{color:#ffd34d}.tool.on svg{color:#ffd34d}
.tool.danger svg{color:var(--blade)}.tool.back svg{color:var(--mute)}
.pop{position:fixed;z-index:20;display:none;min-width:190px;padding:5px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 12px 30px #000a}
.pop.on{display:block}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--ink);text-align:left}
.pop button:hover{background:var(--panel)}.pop button.danger{color:var(--blade)}.pop button.on{color:#ffd34d}
.pop button svg.i{width:17px;height:17px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:62vh;overflow-y:auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -12px 30px #0009;transform:translateY(calc(100% + 40px));transition:transform .22s ease}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet h3{margin:0;font-size:15px}
.prop{display:grid;grid-template-columns:30px 82px minmax(0,1fr) 58px 92px;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #22252c}
.prop .name{font-size:12px;color:var(--mute)}
.prop input[type=range]{width:100%;accent-color:var(--blade)}
.prop output{font:700 12px ui-monospace,Menlo,monospace;text-align:right}
.watch{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mute)}
.watch.on{color:var(--blade);background:#ff5a3c1f}
.nav{display:flex;justify-content:flex-end}.nav button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--mute)}
.nav button.has{color:var(--key)}
.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--mute)}
.field input[type=text]{height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px Manrope,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
.toast{position:fixed;left:50%;top:64px;z-index:30;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (min-width:760px){
  :root{--lw:250px}
  .sw{display:grid}
  .tl{height:36vh}
  .prop{grid-template-columns:30px 110px minmax(0,1fr) 64px 100px}
  .sheet{left:auto;width:440px;right:12px;bottom:12px;border-radius:16px;border:1px solid var(--line)}
}
.ecchk{position:relative;display:inline-flex;align-items:center;justify-content:flex-end;grid-column:1/-1;justify-self:end;cursor:pointer}
.ecchk input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.ecchk span{width:40px;height:22px;border-radius:12px;background:#3a3d46;position:relative;transition:background .15s}
.ecchk span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.ecchk input:checked+span{background:var(--accent,#ff5a3c)}.ecchk input:checked+span::after{left:21px}
.ecchk input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.ecsel{grid-column:1/-1;justify-self:end;background:#22252c;color:inherit;border:1px solid #3a3d46;border-radius:8px;padding:5px 8px;font:inherit;min-height:32px}
.ailrow{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-weight:600}
.aildot{width:10px;height:10px;border-radius:50%;background:#666}.aildot[data-st=linked]{background:#3ddc84}.aildot[data-st=working]{background:#ffb02e}.aildot[data-st=retrying]{background:#ff5a3c}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.ztool{height:32px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;font-weight:800;white-space:nowrap}
.ztool.primary{background:var(--blade);border-color:var(--blade);color:#fff}
.zsave-state{max-width:94px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:10px}
.tlzoom{position:absolute;right:8px;bottom:7px;z-index:9;display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#17191eef}
.tlzoom button{width:30px;height:28px;border-radius:6px;background:var(--panel2);font-size:16px;font-weight:800}
.zleave{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:18px;background:#000b}
.zleave.on{display:grid}.zleave-card{width:min(360px,100%);padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 18px 60px #0009}
.zleave-card h3{margin:0 0 8px;font-size:16px}.zleave-card p{margin:0 0 16px;color:var(--mute);font-size:12px}
.zleave-actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.zleave-actions button{padding:9px 11px;border-radius:8px;background:var(--panel2);font-size:11px;font-weight:800}
.zleave-actions .save{background:var(--blade);color:white}
@media(max-width:520px){.top{gap:4px;padding:6px}.top input{min-width:40px;font-size:11px;padding:0 6px}.ztool{height:30px;padding:0 6px;font-size:10px}.zsave-state{display:none}.logo{font-size:15px;margin-right:0}}
</style>

async function zcutGetCsrf(){

async function saveZcutNow(showToast=true){

    return null;
  }

  try{
    const item=captureZcutProject();await zcutLocalSave(item);
    let cloud="local only";try{cloud=await zcutCloudSave(item);}catch(error){console.warn("[Z_Cut] Cloud sync:",error.message);}
    zcutMediaManifest=item.media;

      zcutDirty=false;zcutStatus(cloud==="cloud synced"?"Saved · cloud synced":"Saved on device");
      if(showToast)toast(cloud==="cloud synced"?"Project saved and synced":"Project saved on this device");
    }else{
      zcutDirty=true;zcutStatus("New edits waiting to save");
      clearTimeout(zcutSaveTimer);zcutSaveTimer=setTimeout(()=>saveZcutNow(false),800);
    }
    return {ok:true,cloud};
  }catch(error){
    zcutStatus("Save failed");if(showToast)toast(error.message||"Project save failed");
    if(zcutDirty){clearTimeout(zcutSaveTimer);zcutSaveTimer=setTimeout(()=>saveZcutNow(false),10000);}

async function loadZcutProject(item,fromFile=false){

async function importZcutFile(file){
