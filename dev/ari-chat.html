<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ari — Local Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font: 16px system-ui, sans-serif; color: #171717; background: #fff; }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #ddd; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    #new-chat { padding: 6px 10px; border: 1px solid #aaa; border-radius: 6px; background: #fff; }
    #conversation { position: relative; flex: 1; overflow-y: auto; padding: 20px 16px; }
    #empty-state { position: absolute; inset: 0; display: grid; place-items: center; color: #888; pointer-events: none; }
    #messages { display: flex; flex-direction: column; gap: 14px; max-width: 760px; margin: 0 auto; }
    .message { max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; }
    .message.user { align-self: flex-end; background: #f4f4f4; }
    .message.ari { align-self: flex-start; }
    .message small { display: block; margin-top: 6px; color: #777; font-size: 11px; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #ddd; }
    #message-input { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid #aaa; border-radius: 8px; outline-offset: 2px; }
    #send { padding: 0 16px; border: 1px solid #333; border-radius: 8px; background: #222; color: white; }
    #send:disabled { opacity: .5; cursor: wait; }
    @media (max-width: 600px) { .message { max-width: 94%; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Ari</h1>
      <button id="new-chat" type="button">New chat</button>
    </header>

    <main id="conversation" aria-live="polite">
      <div id="empty-state">Type to get started with Ari</div>
      <div id="messages"></div>
    </main>

    <form id="chat-form">
      <input id="message-input" type="text" placeholder="Message Ari..." autocomplete="off" maxlength="2000" required>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    "use strict";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const sendButton = document.getElementById("send");
    const newChatButton = document.getElementById("new-chat");
    const messages = document.getElementById("messages");
    const emptyState = document.getElementById("empty-state");
    let hasStarted = false;

    function addMessage(text, speaker, mode) {
      const bubble = document.createElement("div");
      bubble.className = "message " + speaker;
      bubble.textContent = text;

      if (mode) {
        const meta = document.createElement("small");
        meta.textContent = mode;
        bubble.appendChild(meta);
      }

      messages.appendChild(bubble);
      document.getElementById("conversation").scrollTop =
        document.getElementById("conversation").scrollHeight;
      return bubble;
    }

    function beginConversation() {
      if (!hasStarted) {
        hasStarted = true;
        emptyState.hidden = true;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = input.value.trim();
      if (!prompt || sendButton.disabled) return;

      beginConversation();
      addMessage(prompt, "user");
      input.value = "";
      sendButton.disabled = true;

      const waiting = addMessage("Ari is thinking...", "ari");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: prompt })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || "The local Ari server returned an error.");
        }

        waiting.textContent = data.reply || "Ari did not return a response.";
        if (data.mode) {
          const meta = document.createElement("small");
          meta.textContent = data.mode;
          waiting.appendChild(meta);
        }
      } catch (error) {
        waiting.textContent = "Couldn't reach Ari's local server: " + error.message;
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });

    newChatButton.addEventListener("click", () => {
      messages.replaceChildren();
      hasStarted = false;
      emptyState.hidden = false;
      input.value = "";
      input.focus();
    });

    input.focus();
  </script>
</body>
</html>
